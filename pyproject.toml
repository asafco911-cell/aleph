[project]
name = "aleph"
version = "0.1.0"
description = "A bounded-extraction DCF over 10-K filings"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# The capstone pipeline's real imports, and only those. Every name here is
# imported by something under src/aleph/: anthropic and python-dotenv by
# extraction/extractor.py, pydantic by schemas/, pypdf by documents/.
# Nothing else in src/ imports a third-party package.
dependencies = [
    "anthropic>=1.0.0",
    "pydantic>=2.0",
    "pypdf>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# app.py only. The pipeline and every scripts/test_*.py run without it.
ui = ["streamlit>=1.40"]

# tests/ only. The thirteen documented scripts/test_*.py commands are
# standalone and need none of this; pytest covers the newer pure modules.
dev = ["pytest>=8.0"]

# experiments/ch01-ch13 only - archived course chapters, not the capstone.
# Kept declared rather than undeclared so a reader who wants to run one is
# not left guessing, and separate so `pip install -e .` stays small.
experiments = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "instructor>=1.0",
    "langgraph>=0.2",
    "networkx>=3.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only tests/ - scripts/test_*.py are standalone commands documented in
# README.md, run directly and in CI, and are deliberately not collected here.
python_files = ["test_*.py"]
addopts = "-q"
# Registered, not implicit: an unregistered mark is a warning, and a typo in
# `@pytest.mark.needs_filing` would then silently mark nothing - the test would
# run without its filing and fail on a fresh clone, which is the exact failure
# tests/conftest.py exists to remove. Registering it makes the typo an error
# under -W error and a visible warning otherwise.
markers = [
    "needs_filings: needs the six 10-K PDFs, which this repository does not distribute (tests/conftest.py skips these when they are absent)",
]
