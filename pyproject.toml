[project]
name = "aleph"
version = "0.1.0"
description = "Autonomous multi-document financial analyst"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "pypdf>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
